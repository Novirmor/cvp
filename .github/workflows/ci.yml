name: quality

on:
  pull_request:
  push:
    branches: [main, stable]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned tools
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: 2026.3.13
          install: true
          cache: true

      - name: Verify ansible-playbook is provided by mise
        run: mise which ansible-playbook

      - name: Run quality gates
        run: task lint && task test && task security
