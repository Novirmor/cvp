---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
  namespace: data-services
spec:
  hard:
    count/configmaps: "20"
    count/persistentvolumeclaims: "4"
    count/secrets: "20"
    count/services: "10"
    limits.cpu: "2"
    limits.ephemeral-storage: 4Gi
