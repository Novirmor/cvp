---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: application-backup
  labels:
    app.kubernetes.io/name: application-backup
    app.kubernetes.io/part-of: cvp
    cvp.example.com/lifecycle: non-production-template
  annotations:
    cvp.example.com/status: suspended-until-provider-and-application-are-selected
spec:
  schedule: 17 2 * * *
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: application-backup
        app.kubernetes.io/part-of: cvp
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: application-backup
            app.kubernetes.io/part-of: cvp
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          serviceAccountName: backup-runner
          securityContext:
            fsGroup: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: alpine:3.20.3@sha256:1e42bbe2508154c9126d48c2b8a75420c3544343bf86fd041fb7527e017a4b4a
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - /scripts/backup.sh
              env:
                - name: BACKUP_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: bucket
                - name: BACKUP_PREFIX
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: prefix
              resources:
                requests:
                  cpu: 50m
                  ephemeral-storage: 128Mi
                  memory: 64Mi
                limits:
                  cpu: 250m
                  ephemeral-storage: 512Mi
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: backup-scripts
                  mountPath: /scripts
                  readOnly: true
                - name: source
                  mountPath: /source
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup-scripts
              configMap:
                name: backup-scripts
                defaultMode: 365
            - name: source
              emptyDir: {}
            - name: work
              emptyDir: {}
            - name: tmp
              emptyDir: {}
