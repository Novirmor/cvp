---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-check
  labels:
    app.kubernetes.io/name: backup-check
    app.kubernetes.io/part-of: cvp
    cvp.novirmor.io/lifecycle: non-production-template
  annotations:
    cvp.novirmor.io/status: suspended-until-provider-and-application-are-selected
spec:
  schedule: 47 2 * * *
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: backup-check
        app.kubernetes.io/part-of: cvp
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup-check
            app.kubernetes.io/part-of: cvp
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            fsGroup: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              image: alpine:3.20.3@sha256:1e42bbe2508154c9126d48c2b8a75420c3544343bf86fd041fb7527e017a4b4a
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
              args:
                - /scripts/check.sh
              env:
                - name: BACKUP_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: bucket
                - name: BACKUP_PREFIX
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: prefix
                - name: EXPECTED_OBJECT
                  valueFrom:
                    secretKeyRef:
                      name: backup-credentials
                      key: expected-object
              resources:
                requests:
                  cpu: 25m
                  ephemeral-storage: 32Mi
                  memory: 32Mi
                limits:
                  cpu: 100m
                  ephemeral-storage: 128Mi
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: backup-scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backup-scripts
              configMap:
                name: backup-scripts
                defaultMode: 365
            - name: tmp
              emptyDir: {}
