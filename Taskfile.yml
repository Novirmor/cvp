---
version: "3"

vars:
  # Platform development runs against the bundled, empty example instance.
  EXAMPLE_INVENTORY: -i ansible/defaults/inventory.yml -i examples/instance/inventory/hosts.yml

includes:
  ops:
    taskfile: ./tasks/ops.yml
    flatten: true

tasks:
  new-instance:
    desc: >-
      Create an instance repository that pins this platform
      (e.g. task new-instance -- ../my-platform --platform-url https://github.com/OWNER/cvp.git)
    cmds:
      - mise exec -- python3 -B scripts/cvp_instance.py new {{.CLI_ARGS}}

  build-collection:
    desc: Build the cvp.platform collection tarball and print its sha256
    cmds:
      - mise exec -- python3 -B scripts/build-collection {{.CLI_ARGS}}

  default:
    cmds:
      - task: lint

  lint:
    desc: Run repository formatting and lint checks
    cmds:
      - mise exec -- ./scripts/lint-worktree
      - ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-lint ansible
      - mise exec -- conftest fmt --check tests/policy

  test:
    desc: Run credential-free repository tests
    deps:
      - deps
    cmds:
      - git diff --check
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook {{.EXAMPLE_INVENTORY}}
        ansible/playbooks/site.yml --syntax-check
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook {{.EXAMPLE_INVENTORY}}
        ansible/playbooks/probe.yml --syntax-check
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook {{.EXAMPLE_INVENTORY}}
        ansible/playbooks/probe-wireguard.yml --syntax-check
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook {{.EXAMPLE_INVENTORY}}
        ansible/playbooks/restore-k3s.yml --syntax-check
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook {{.EXAMPLE_INVENTORY}}
        ansible/playbooks/bootstrap-access.yml --syntax-check
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook {{.EXAMPLE_INVENTORY}}
        ansible/playbooks/export-kubeconfig.yml --syntax-check
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook {{.EXAMPLE_INVENTORY}}
        ansible/playbooks/validate-inventory.yml --syntax-check
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook {{.EXAMPLE_INVENTORY}}
        ansible/playbooks/verify.yml --syntax-check
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook
        -i localhost, ansible/playbooks/test-templates.yml
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook
        {{.EXAMPLE_INVENTORY}} ansible/playbooks/test-labels.yml
      - mise exec -- python3 -B scripts/test-node-lifecycle.py
      - mise exec -- python3 -B scripts/test-init.py
      - mise exec -- ./scripts/test-prepare-access
      - mise exec -- python3 -B scripts/test-wrapper-safety.py
      - mise exec -- python3 -B scripts/test-tofu-identity.py
      - mise exec -- python3 -B scripts/test-storage-safety.py
      - mise exec -- python3 -B scripts/test-operator-config.py
      - mise exec -- python3 -B scripts/test-kubeconfig-export.py -v
      - mise exec -- python3 -B scripts/test-admin-access.py -v
      - mise exec -- python3 -B scripts/test-topology.py
      - mise exec -- python3 -B scripts/test-site-orchestration.py -v
      - mise exec -- python3 -B scripts/test-onboarding-path.py -v
      - mise exec -- python3 -B scripts/test-verification.py
      - mise exec -- python3 -B scripts/test-backup-config.py
      - mise exec -- python3 -B scripts/test-collection-build.py
      - mise exec -- python3 -B scripts/test-k3s-lifecycle.py -v
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook
        -i localhost, ansible/playbooks/test-host-network-security.yml
      - mise exec -- ./scripts/test-manifests
      - |
        if mise exec -- ./scripts/tofu-operation cloudflare plan -var-file=/tmp/vars; then
          echo "unsafe tofu plan unexpectedly succeeded" >&2
          exit 1
        fi
        if mise exec -- ./scripts/tofu-operation cloudflare apply; then
          echo "unsafe tofu apply unexpectedly succeeded" >&2
          exit 1
        fi
      - |
        for module in tofu/cloudflare tofu/tailscale; do
          (
            data_dir="$(mktemp -d)"
            trap 'rm -rf "$data_dir"' EXIT
            TF_DATA_DIR="$data_dir" mise exec -- tofu -chdir="$module" init \
              -backend=false -input=false -lockfile=readonly
            TF_DATA_DIR="$data_dir" mise exec -- tofu -chdir="$module" validate
          )
        done

  security:
    desc: Scan repository content for secrets
    cmds:
      - mise exec -- gitleaks dir --redact --no-banner --config .gitleaks.toml .

  test-firewall-dataplane:
    desc: Run real-kernel firewall checks in unprivileged isolated network namespaces
    cmds:
      - mise exec -- python3 -B scripts/test-firewall-dataplane.py

  test-wireguard-dataplane:
    desc: Run WireGuard reconciliation checks in isolated unprivileged network namespaces
    cmds:
      - mise exec -- python3 -B scripts/test-wireguard-dataplane.py
