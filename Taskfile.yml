---
version: "3"

tasks:
  default:
    cmds:
      - task: lint

  deps:
    desc: Install pinned Ansible collections locally
    cmds:
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-galaxy collection install
        -r ansible/requirements.yml -p ansible/collections

  lint:
    desc: Run repository formatting and lint checks
    cmds:
      - mise exec -- ./scripts/lint-worktree
      - ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-lint ansible

  test:
    desc: Run credential-free repository tests
    deps:
      - deps
    cmds:
      - git diff --check
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook -i ansible/inventory/hosts.yml
        ansible/playbooks/site.yml --syntax-check
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook -i ansible/inventory/hosts.yml
        ansible/playbooks/probe.yml --syntax-check
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook -i ansible/inventory/hosts.yml
        ansible/playbooks/probe-wireguard.yml --syntax-check
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook -i ansible/inventory/hosts.yml
        ansible/playbooks/restore-k3s.yml --syntax-check
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook -i ansible/inventory/hosts.yml
        ansible/playbooks/bootstrap-access.yml --syntax-check
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook -i ansible/inventory/hosts.yml
        ansible/playbooks/verify.yml --syntax-check
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook
        -i localhost, ansible/playbooks/test-templates.yml
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook
        -i ansible/inventory/hosts.yml ansible/playbooks/test-labels.yml
      - mise exec -- ./scripts/test-onboard-node
      - mise exec -- ./scripts/test-prepare-access
      - mise exec -- ./scripts/test-manifests
      - |
        if mise exec -- ./scripts/tofu-operation cloudflare plan -var-file=/tmp/vars; then
          echo "unsafe tofu plan unexpectedly succeeded" >&2
          exit 1
        fi
        if mise exec -- ./scripts/tofu-operation cloudflare apply; then
          echo "unsafe tofu apply unexpectedly succeeded" >&2
          exit 1
        fi
      - |
        for module in tofu/cloudflare tofu/tailscale; do
          (
            data_dir="$(mktemp -d)"
            trap 'rm -rf "$data_dir"' EXIT
            TF_DATA_DIR="$data_dir" mise exec -- tofu -chdir="$module" init \
              -backend=false -input=false -lockfile=readonly
            TF_DATA_DIR="$data_dir" mise exec -- tofu -chdir="$module" validate
          )
        done

  security:
    desc: Scan repository content for secrets
    cmds:
      - mise exec -- gitleaks dir --redact --no-banner --config .gitleaks.toml .

  probe:
    desc: Check host capabilities before convergence, without requiring an active WireGuard mesh
    cmds:
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook -i ansible/inventory/hosts.yml
        ansible/playbooks/probe.yml {{.CLI_ARGS}}

  probe-wireguard:
    desc: Check the converged WireGuard mesh and path MTU (run after task site)
    cmds:
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook -i ansible/inventory/hosts.yml
        ansible/playbooks/probe-wireguard.yml {{.CLI_ARGS}}

  onboard:
    desc: >-
      Guarded node onboarding (set CVP_ONBOARD_NODE and CVP_ONBOARD_CONFIRM;
      converges the full fleet after read-only checks)
    cmds:
      - mise exec -- ./scripts/onboard-node

  prepare-access:
    desc: >-
      Prepare one new host for Ansible (set CVP_ACCESS_NODE,
      CVP_ACCESS_CONFIRM, and CVP_ACCESS_PUBLIC_KEY_FILE)
    cmds:
      - mise exec -- ./scripts/prepare-node-access

  bootstrap-access:
    desc: >-
      Low-level root-to-ops bootstrap without changing network policy
      (requires CVP_BOOTSTRAP_ADMIN_KEYS, --limit, and
      -e ansible_user=root -e ansible_become=false; prefer task prepare-access)
    cmds:
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook -i ansible/inventory/hosts.yml
        ansible/playbooks/bootstrap-access.yml {{.CLI_ARGS}}

  site:
    desc: >-
      Converge hosts and the K3s cluster
      (e.g. task site -- --check --diff, or
      task site -- -e '{"firewall_ssh_ipv4_source_cidrs":["203.0.113.10/32"]}')
    cmds:
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook -i ansible/inventory/hosts.yml
        ansible/playbooks/site.yml {{.CLI_ARGS}}

  verify:
    desc: Read-only verification of hosts, network, storage, and cluster health
    cmds:
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook -i ansible/inventory/hosts.yml
        ansible/playbooks/verify.yml {{.CLI_ARGS}}

  restore-k3s:
    desc: >-
      Destructively restore the K3s datastore and tokens from an age archive
      (requires the K3S_RESTORE_* environment variables and --limit; see ansible/README.md)
    cmds:
      - >-
        ANSIBLE_CONFIG=ansible/ansible.cfg mise exec -- ansible-playbook
        -i ansible/inventory/hosts.yml ansible/playbooks/restore-k3s.yml {{.CLI_ARGS}}

  bootstrap-flux:
    desc: >-
      One-time Flux bootstrap against an explicit context
      (requires FLUX_GITHUB_OWNER, FLUX_GITHUB_REPOSITORY,
      FLUX_KUBE_CONTEXT, FLUX_GIT_SSH_KEY_FILE,
      FLUX_GIT_KNOWN_HOSTS_FILE, and SOPS_AGE_KEY_FILE)
    cmds:
      - mise exec -- ./scripts/bootstrap-flux

  render:
    desc: Render a Kustomize overlay (e.g. task render -- cluster/apps/overlays/smoke)
    cmds:
      - mise exec -- kubectl kustomize {{.CLI_ARGS}}

  cloudflare-init:
    desc: >-
      Initialize the Cloudflare root against its backend
      (e.g. task cloudflare-init -- -backend-config=/secure/path/backend.hcl)
    cmds:
      - mise exec -- tofu -chdir=tofu/cloudflare init -input=false {{.CLI_ARGS}}

  cloudflare-plan:
    desc: >-
      Plan the Cloudflare root
      (e.g. task cloudflare-plan -- -var-file=/secure/path/cloudflare.tfvars -out=/secure/path/plan.tfplan)
    cmds:
      - mise exec -- ./scripts/tofu-operation cloudflare plan {{.CLI_ARGS}}

  cloudflare-drift-plan:
    desc: Save a refresh-only Cloudflare drift plan for review
    cmds:
      - mise exec -- ./scripts/tofu-operation cloudflare drift-plan {{.CLI_ARGS}}

  cloudflare-show:
    desc: Show a saved Cloudflare plan (e.g. task cloudflare-show -- /secure/path/plan.tfplan)
    cmds:
      - mise exec -- ./scripts/tofu-operation cloudflare show {{.CLI_ARGS}}

  cloudflare-apply:
    desc: Apply a reviewed Cloudflare plan (e.g. task cloudflare-apply -- /secure/path/plan.tfplan)
    cmds:
      - mise exec -- ./scripts/tofu-operation cloudflare apply {{.CLI_ARGS}}

  cloudflare-import:
    desc: Import one existing Cloudflare resource after inventory review
    cmds:
      - mise exec -- ./scripts/tofu-operation cloudflare import {{.CLI_ARGS}}

  cloudflare-state-list:
    desc: List addresses in the Cloudflare state
    cmds:
      - mise exec -- ./scripts/tofu-operation cloudflare state-list

  cloudflare-state-pull:
    desc: Snapshot Cloudflare state to an absolute path outside the repository
    cmds:
      - mise exec -- ./scripts/tofu-operation cloudflare state-pull {{.CLI_ARGS}}

  tailscale-init:
    desc: >-
      Initialize the Tailscale root against its backend
      (e.g. task tailscale-init -- -backend-config=/secure/path/backend.hcl)
    cmds:
      - mise exec -- tofu -chdir=tofu/tailscale init -input=false {{.CLI_ARGS}}

  tailscale-plan:
    desc: >-
      Plan the Tailscale root
      (e.g. task tailscale-plan -- -var-file=/secure/path/tailscale.tfvars -out=/secure/path/plan.tfplan)
    cmds:
      - mise exec -- ./scripts/tofu-operation tailscale plan {{.CLI_ARGS}}

  tailscale-drift-plan:
    desc: Save a refresh-only Tailscale drift plan for review
    cmds:
      - mise exec -- ./scripts/tofu-operation tailscale drift-plan {{.CLI_ARGS}}

  tailscale-show:
    desc: Show a saved Tailscale plan (e.g. task tailscale-show -- /secure/path/plan.tfplan)
    cmds:
      - mise exec -- ./scripts/tofu-operation tailscale show {{.CLI_ARGS}}

  tailscale-apply:
    desc: Apply a reviewed Tailscale plan (e.g. task tailscale-apply -- /secure/path/plan.tfplan)
    cmds:
      - mise exec -- ./scripts/tofu-operation tailscale apply {{.CLI_ARGS}}

  tailscale-import:
    desc: Import one existing Tailscale resource after inventory review
    cmds:
      - mise exec -- ./scripts/tofu-operation tailscale import {{.CLI_ARGS}}

  tailscale-state-list:
    desc: List addresses in the Tailscale state
    cmds:
      - mise exec -- ./scripts/tofu-operation tailscale state-list

  tailscale-state-pull:
    desc: Snapshot Tailscale state to an absolute path outside the repository
    cmds:
      - mise exec -- ./scripts/tofu-operation tailscale state-pull {{.CLI_ARGS}}
