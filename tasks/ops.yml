---
# Operational tasks. The platform's root Taskfile includes this file, and every
# instance repository includes it from its platform/ submodule (flattened), so
# the same task names work in both. Commands run in the including directory
# and reach platform files through PLATFORM_DIR.
version: "3"

vars:
  PLATFORM_DIR: '{{dir .TASKFILE_DIR}}'
  # An instance passes INSTANCE_NAME through its include; run inside the
  # platform repository itself, the bundled example instance is used.
  INSTANCE_DIR: >-
    {{.CVP_INSTANCE_DIR | default (ternary (printf "%s/examples/instance" (dir .TASKFILE_DIR))
    .ROOT_DIR (eq .ROOT_DIR (dir .TASKFILE_DIR)))}}
  INSTANCE_NAME: '{{.INSTANCE_NAME | default ""}}'
  INVENTORY: >-
    -i {{dir .TASKFILE_DIR}}/ansible/defaults/inventory.yml -i {{.INSTANCE_DIR}}/inventory/hosts.yml

env:
  ANSIBLE_CONFIG: '{{.PLATFORM_DIR}}/ansible/ansible.cfg'
  CVP_INSTANCE_DIR: '{{.INSTANCE_DIR}}'
  CVP_INSTANCE_NAME: '{{.INSTANCE_NAME}}'

tasks:
  deps:
    desc: Install pinned Ansible collections locally
    cmds:
      - >-
        mise exec -- ansible-galaxy collection install
        -r {{.PLATFORM_DIR}}/ansible/requirements.yml -p {{.PLATFORM_DIR}}/ansible/collections

  tailscale-identity-init:
    desc: Establish the protected tailnet identity in empty state before imports
    env:
      TF_DATA_DIR: '{{.INSTANCE_DIR}}/.tofu/tailscale'
    cmds:
      - mise exec -- {{.PLATFORM_DIR}}/scripts/tofu-operation tailscale establish-identity {{.CLI_ARGS}}

  probe:
    desc: Check host capabilities before convergence, without requiring an active WireGuard mesh
    cmds:
      - >-
        mise exec -- ansible-playbook {{.INVENTORY}}
        {{.PLATFORM_DIR}}/ansible/playbooks/probe.yml {{.CLI_ARGS}}

  validate-inventory:
    desc: Validate operator configuration, topology, and node tags without contacting hosts
    cmds:
      - >-
        mise exec -- ansible-playbook
        {{.INVENTORY}} {{.PLATFORM_DIR}}/ansible/playbooks/validate-inventory.yml

  export-kubeconfig:
    desc: Export a private TLS-verified cluster-admin kubeconfig with explicit host confirmation
    cmds:
      - mise exec -- {{.PLATFORM_DIR}}/scripts/export-kubeconfig

  probe-wireguard:
    desc: Check the converged WireGuard mesh and path MTU (run after task site)
    cmds:
      - >-
        mise exec -- ansible-playbook {{.INVENTORY}}
        {{.PLATFORM_DIR}}/ansible/playbooks/probe-wireguard.yml {{.CLI_ARGS}}

  init:
    desc: >-
      Guided setup: take a fresh Debian host to a joined node (first run creates
      the cluster; rerun to add hosts or resume). See README Quickstart.
    interactive: true
    cmds:
      - mise exec -- python3 -B {{.PLATFORM_DIR}}/scripts/cvp_init.py {{.CLI_ARGS}}

  node-new:
    desc: >-
      Scaffold one node's inventory, host vars, WireGuard key, and operator entry
      without contacting it (dry run unless --write;
      e.g. task node-new -- worker1 --ssh 203.0.113.21 --virt vm --ssh-source 203.0.113.10/32)
    cmds:
      - mise exec -- python3 -B {{.PLATFORM_DIR}}/scripts/cvp_node.py new {{.CLI_ARGS}}

  node-join:
    desc: >-
      Resumably prepare access, probe, and join one node, including the first
      (e.g. task node-join -- worker1 --confirm worker1)
    cmds:
      - mise exec -- python3 -B {{.PLATFORM_DIR}}/scripts/cvp_node.py join {{.CLI_ARGS}}

  node-bootstrap:
    desc: >-
      Copy scripts/node-bootstrap.sh to a fresh Debian host over SSH and run it
      as root to create the ops operator
      (e.g. task node-bootstrap -- worker1 --confirm worker1 --host-key-fingerprint SHA256:...)
    interactive: true
    cmds:
      - mise exec -- python3 -B {{.PLATFORM_DIR}}/scripts/cvp_node.py bootstrap {{.CLI_ARGS}}

  onboard:
    desc: >-
      Compatibility alias for node-join on an existing cluster
      (set CVP_ONBOARD_NODE and CVP_ONBOARD_CONFIRM)
    cmds:
      - mise exec -- {{.PLATFORM_DIR}}/scripts/onboard-node

  prepare-access:
    desc: >-
      Prepare one new host for Ansible (set CVP_ACCESS_NODE,
      CVP_ACCESS_CONFIRM, and CVP_ACCESS_PUBLIC_KEY_FILE)
    cmds:
      - mise exec -- {{.PLATFORM_DIR}}/scripts/prepare-node-access

  bootstrap-access:
    desc: >-
      Low-level root-to-ops bootstrap without changing network policy
      (requires CVP_BOOTSTRAP_ADMIN_KEYS, --limit, and
      -e ansible_user=root -e ansible_become=false; prefer task prepare-access)
    cmds:
      - >-
        mise exec -- ansible-playbook {{.INVENTORY}}
        {{.PLATFORM_DIR}}/ansible/playbooks/bootstrap-access.yml {{.CLI_ARGS}}

  site:
    desc: >-
      Converge hosts and the K3s cluster
      (e.g. task site -- --check --diff, or
      task site -- -e '{"firewall_ssh_ipv4_source_cidrs":["203.0.113.10/32"]}')
    cmds:
      - >-
        mise exec -- ansible-playbook {{.INVENTORY}}
        {{.PLATFORM_DIR}}/ansible/playbooks/site.yml {{.CLI_ARGS}}

  verify:
    desc: Read-only verification of hosts, network, storage, and cluster health
    cmds:
      - >-
        mise exec -- ansible-playbook {{.INVENTORY}}
        {{.PLATFORM_DIR}}/ansible/playbooks/verify.yml {{.CLI_ARGS}}

  restore-k3s:
    desc: >-
      Destructively restore the K3s datastore and tokens from an age archive
      (requires the K3S_RESTORE_* environment variables and --limit; see ansible/README.md)
    cmds:
      - >-
        mise exec -- ansible-playbook
        {{.INVENTORY}} {{.PLATFORM_DIR}}/ansible/playbooks/restore-k3s.yml {{.CLI_ARGS}}

  bootstrap-flux:
    desc: >-
      One-time Flux bootstrap against an explicit context
      (requires FLUX_GITHUB_OWNER, FLUX_GITHUB_REPOSITORY,
      FLUX_KUBE_CONTEXT, FLUX_GIT_SSH_KEY_FILE,
      FLUX_GIT_KNOWN_HOSTS_FILE, and SOPS_AGE_KEY_FILE)
    cmds:
      - mise exec -- {{.PLATFORM_DIR}}/scripts/bootstrap-flux

  render:
    desc: Render a Kustomize overlay (e.g. task render -- cluster/apps/overlays/smoke)
    cmds:
      - mise exec -- kubectl kustomize {{.CLI_ARGS}}

  cloudflare-init:
    desc: >-
      Initialize the Cloudflare root against its backend
      (e.g. task cloudflare-init -- -backend-config=/secure/path/backend.hcl)
    env:
      TF_DATA_DIR: '{{.INSTANCE_DIR}}/.tofu/cloudflare'
    cmds:
      - mise exec -- tofu -chdir={{.PLATFORM_DIR}}/tofu/cloudflare init -input=false {{.CLI_ARGS}}

  cloudflare-plan:
    desc: >-
      Plan the Cloudflare root
      (e.g. task cloudflare-plan -- -var-file=/secure/path/cloudflare.tfvars -out=/secure/path/plan.tfplan)
    env:
      TF_DATA_DIR: '{{.INSTANCE_DIR}}/.tofu/cloudflare'
    cmds:
      - mise exec -- {{.PLATFORM_DIR}}/scripts/tofu-operation cloudflare plan {{.CLI_ARGS}}

  cloudflare-drift-plan:
    desc: Save a refresh-only Cloudflare drift plan for review
    env:
      TF_DATA_DIR: '{{.INSTANCE_DIR}}/.tofu/cloudflare'
    cmds:
      - mise exec -- {{.PLATFORM_DIR}}/scripts/tofu-operation cloudflare drift-plan {{.CLI_ARGS}}

  cloudflare-show:
    desc: Show a saved Cloudflare plan (e.g. task cloudflare-show -- /secure/path/plan.tfplan)
    env:
      TF_DATA_DIR: '{{.INSTANCE_DIR}}/.tofu/cloudflare'
    cmds:
      - mise exec -- {{.PLATFORM_DIR}}/scripts/tofu-operation cloudflare show {{.CLI_ARGS}}

  cloudflare-apply:
    desc: Apply a reviewed Cloudflare plan (e.g. task cloudflare-apply -- /secure/path/plan.tfplan)
    env:
      TF_DATA_DIR: '{{.INSTANCE_DIR}}/.tofu/cloudflare'
    cmds:
      - mise exec -- {{.PLATFORM_DIR}}/scripts/tofu-operation cloudflare apply {{.CLI_ARGS}}

  cloudflare-import:
    desc: Import one existing Cloudflare resource after inventory review
    env:
      TF_DATA_DIR: '{{.INSTANCE_DIR}}/.tofu/cloudflare'
    cmds:
      - mise exec -- {{.PLATFORM_DIR}}/scripts/tofu-operation cloudflare import {{.CLI_ARGS}}

  cloudflare-state-list:
    desc: List addresses in the Cloudflare state
    env:
      TF_DATA_DIR: '{{.INSTANCE_DIR}}/.tofu/cloudflare'
    cmds:
      - mise exec -- {{.PLATFORM_DIR}}/scripts/tofu-operation cloudflare state-list

  cloudflare-state-pull:
    desc: Snapshot Cloudflare state to an absolute path outside the repository
    env:
      TF_DATA_DIR: '{{.INSTANCE_DIR}}/.tofu/cloudflare'
    cmds:
      - mise exec -- {{.PLATFORM_DIR}}/scripts/tofu-operation cloudflare state-pull {{.CLI_ARGS}}

  tailscale-init:
    desc: >-
      Initialize the Tailscale root against its backend
      (e.g. task tailscale-init -- -backend-config=/secure/path/backend.hcl)
    env:
      TF_DATA_DIR: '{{.INSTANCE_DIR}}/.tofu/tailscale'
    cmds:
      - mise exec -- tofu -chdir={{.PLATFORM_DIR}}/tofu/tailscale init -input=false {{.CLI_ARGS}}

  tailscale-plan:
    desc: >-
      Plan the Tailscale root
      (e.g. task tailscale-plan -- -var-file=/secure/path/tailscale.tfvars -out=/secure/path/plan.tfplan)
    env:
      TF_DATA_DIR: '{{.INSTANCE_DIR}}/.tofu/tailscale'
    cmds:
      - mise exec -- {{.PLATFORM_DIR}}/scripts/tofu-operation tailscale plan {{.CLI_ARGS}}

  tailscale-drift-plan:
    desc: Save a refresh-only Tailscale drift plan for review
    env:
      TF_DATA_DIR: '{{.INSTANCE_DIR}}/.tofu/tailscale'
    cmds:
      - mise exec -- {{.PLATFORM_DIR}}/scripts/tofu-operation tailscale drift-plan {{.CLI_ARGS}}

  tailscale-show:
    desc: Show a saved Tailscale plan (e.g. task tailscale-show -- /secure/path/plan.tfplan)
    env:
      TF_DATA_DIR: '{{.INSTANCE_DIR}}/.tofu/tailscale'
    cmds:
      - mise exec -- {{.PLATFORM_DIR}}/scripts/tofu-operation tailscale show {{.CLI_ARGS}}

  tailscale-apply:
    desc: Apply a reviewed Tailscale plan (e.g. task tailscale-apply -- /secure/path/plan.tfplan)
    env:
      TF_DATA_DIR: '{{.INSTANCE_DIR}}/.tofu/tailscale'
    cmds:
      - mise exec -- {{.PLATFORM_DIR}}/scripts/tofu-operation tailscale apply {{.CLI_ARGS}}

  tailscale-import:
    desc: Import one existing Tailscale resource after inventory review
    env:
      TF_DATA_DIR: '{{.INSTANCE_DIR}}/.tofu/tailscale'
    cmds:
      - mise exec -- {{.PLATFORM_DIR}}/scripts/tofu-operation tailscale import {{.CLI_ARGS}}

  tailscale-state-list:
    desc: List addresses in the Tailscale state
    env:
      TF_DATA_DIR: '{{.INSTANCE_DIR}}/.tofu/tailscale'
    cmds:
      - mise exec -- {{.PLATFORM_DIR}}/scripts/tofu-operation tailscale state-list

  tailscale-state-pull:
    desc: Snapshot Tailscale state to an absolute path outside the repository
    env:
      TF_DATA_DIR: '{{.INSTANCE_DIR}}/.tofu/tailscale'
    cmds:
      - mise exec -- {{.PLATFORM_DIR}}/scripts/tofu-operation tailscale state-pull {{.CLI_ARGS}}
