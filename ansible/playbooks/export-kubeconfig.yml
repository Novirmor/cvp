---
- name: Privately stage the explicitly confirmed server admin kubeconfig
  hosts: k3s_servers
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars:
    cvp_kubeconfig_host: "{{ lookup('ansible.builtin.env', 'CVP_KUBECONFIG_HOST') }}"
    cvp_kubeconfig_confirm: "{{ lookup('ansible.builtin.env', 'CVP_KUBECONFIG_CONFIRM') }}"
    cvp_kubeconfig_staging_file: "{{ lookup('ansible.builtin.env', 'CVP_KUBECONFIG_STAGING_FILE') }}"
  tasks:
    - name: Require one explicitly confirmed inventory server
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
          - ansible_play_hosts_all | length == 1
          - inventory_hostname == cvp_kubeconfig_host
          - cvp_kubeconfig_confirm == cvp_kubeconfig_host
          - node_name == inventory_hostname
          - k3s_role == 'server'
          - inventory_hostname not in groups.get('k3s_agents', [])
        fail_msg: Use scripts/export-kubeconfig with an explicitly confirmed inventory server.

    - name: Require the wrapper's private controller staging file
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -B
          - "{{ playbook_dir }}/../../scripts/cvp_export_kubeconfig.py"
          - check-staging
      delegate_to: localhost
      vars:
        ansible_become: false
        ansible_connection: local
        ansible_remote_tmp: "{{ cvp_kubeconfig_staging_file | dirname }}/ansible-controller"
      changed_when: false
      no_log: true

    - name: Slurp the current embedded K3s admin credentials
      ansible.builtin.slurp:
        src: /etc/rancher/k3s/k3s.yaml
      register: cvp_kubeconfig_remote
      no_log: true

    - name: Copy only base64 transport data into private controller staging
      ansible.builtin.copy:
        content: "{{ cvp_kubeconfig_remote.content }}"
        dest: "{{ cvp_kubeconfig_staging_file }}"
        mode: "0600"
        follow: false
        unsafe_writes: false
      delegate_to: localhost
      vars:
        ansible_become: false
        ansible_connection: local
        ansible_remote_tmp: "{{ cvp_kubeconfig_staging_file | dirname }}/ansible-controller"
      no_log: true
