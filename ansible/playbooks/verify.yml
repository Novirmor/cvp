---
- name: Load persistent operator configuration
  ansible.builtin.import_playbook: load-operator-config.yml

- name: Verify host and K3s state without changing it
  hosts: wireguard
  become: true
  gather_facts: true
  tasks:
    - name: Read WireGuard state
      ansible.builtin.command: wg show {{ wireguard_interface }}
      register: verify_wireguard
      changed_when: false
      check_mode: false

    - name: Read WireGuard address
      ansible.builtin.command: ip -j address show dev {{ wireguard_interface }}
      register: verify_wireguard_address
      changed_when: false
      check_mode: false

    - name: Verify the expected WireGuard address is configured
      ansible.builtin.assert:
        that:
          - >-
            verify_wireguard_address.stdout | from_json
            | selectattr('ifname', 'equalto', wireguard_interface)
            | map(attribute='addr_info') | flatten
            | selectattr('family', 'equalto', 'inet')
            | selectattr('local', 'equalto', wireguard_address)
            | selectattr('prefixlen', 'equalto', 24) | list | length == 1
        fail_msg: >-
          {{ wireguard_interface }} is up but does not have exactly {{ wireguard_address }}/24.

    - name: Verify the applied WireGuard configuration
      ansible.builtin.include_role:
        name: wireguard
        tasks_from: verify

    - name: Check Tailscale without changing enrollment
      ansible.builtin.command: tailscale status --json
      register: verify_tailscale
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Require Tailscale to be running
      ansible.builtin.assert:
        that:
          - verify_tailscale.rc == 0
          - (verify_tailscale.stdout | from_json).BackendState == 'Running'
        fail_msg: Tailscale must report BackendState Running in valid JSON.

    # Evidence for gate records: which environment each node actually runs on.
    - name: Detect the virtualization environment
      ansible.builtin.command: systemd-detect-virt
      register: verify_virt
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Require a conclusive virtualization detection
      ansible.builtin.assert:
        that:
          - verify_virt.rc in [0, 1]
          - >-
            (verify_virt.rc == 1 and verify_virt.stdout | trim == 'none')
            or (verify_virt.rc == 0 and verify_virt.stdout | trim in
                (node_container_ids + node_vm_ids))
        fail_msg: >-
          systemd-detect-virt failed or returned an unknown environment
          (rc={{ verify_virt.rc }}, output='{{ verify_virt.stdout | trim }}').
          Cannot verify an unclassified host.

    - name: Classify the detected environment
      ansible.builtin.set_fact:
        verify_detected_env: >-
          {{ 'lxc' if verify_virt.stdout | trim in node_container_ids
             else 'vm' if verify_virt.stdout | trim in node_vm_ids
             else 'metal' }}

    - name: Require a pinned environment declaration to match reality
      ansible.builtin.assert:
        that:
          - node_virtualization == verify_detected_env
        fail_msg: >-
          node_virtualization pins {{ node_virtualization }} but
          systemd-detect-virt reports '{{ verify_virt.stdout | trim | default('none', true) }}'
          ({{ verify_detected_env }}). The host moved to a different
          environment than the inventory records; reconcile the inventory and
          re-run the probe before accepting this node as verified.
      when: node_virtualization != 'auto'

    - name: Report the effective environment
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} runs on
          '{{ verify_virt.stdout | trim | default('none', true) }}'
          ({{ verify_detected_env }}; declared: {{ node_virtualization }})

    - name: Read live network sysctls
      ansible.builtin.command:
        argv: [sysctl, -n, "{{ item.key }}"]
      loop: "{{ base_sysctls | dict2items }}"
      register: verify_sysctls
      changed_when: false
      check_mode: false
      failed_when: false

    - name: Require live network sysctls to match inventory
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - item.stdout | trim == item.item.value | string
        fail_msg: >-
          Live {{ item.item.key }} is '{{ item.stdout | trim }}'
          (rc={{ item.rc }}); expected {{ item.item.value }}.
      loop: "{{ verify_sysctls.results }}"
      loop_control:
        label: "{{ item.item.key }}"

    - name: Read live IPv6 router advertisement settings
      ansible.builtin.command:
        argv: [sysctl, -n, "net.ipv6.conf.{{ item }}.accept_ra"]
      loop: "{{ base_ra_interfaces }}"
      register: verify_ra
      changed_when: false
      check_mode: false
      failed_when: false
      when: base_sysctls['net.ipv6.conf.all.forwarding'] | string == '1'

    - name: Require router advertisements on forwarding-enabled uplinks
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - item.stdout | trim == '2'
        fail_msg: >-
          {{ item.item }} needs live IPv6 accept_ra=2 with forwarding enabled;
          observed '{{ item.stdout | trim }}' (rc={{ item.rc }}).
      loop: "{{ verify_ra.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: base_sysctls['net.ipv6.conf.all.forwarding'] | string == '1'

    - name: Check WireGuard service
      ansible.builtin.systemd_service:
        name: wg-quick@{{ wireguard_interface }}.service
      register: verify_wireguard_service
      changed_when: false

    - name: Verify the applied firewall policy
      ansible.builtin.include_role:
        name: firewall
        tasks_from: verify

    - name: Check K3s service
      ansible.builtin.systemd_service:
        name: "{{ 'k3s.service' if k3s_role == 'server' else 'k3s-agent.service' }}"
      register: verify_k3s_service
      changed_when: false

    - name: Verify storage mount identity and filesystem
      ansible.builtin.include_role:
        name: storage
        tasks_from: verify

    - name: Verify required host services
      ansible.builtin.assert:
        that:
          - verify_wireguard_service.status.ActiveState == 'active'
          - verify_k3s_service.status.ActiveState == 'active'
        fail_msg: >-
          One or more host checks failed. Inspect the registered command output
          and systemd journal before changing the host.

    - name: Wait for Flannel to publish the subnet environment
      ansible.builtin.wait_for:
        path: /run/flannel/subnet.env
        state: present
        timeout: 300
      check_mode: false
      when: k3s_role is defined

    - name: Read the Flannel MTU
      ansible.builtin.command:
        argv:
          - awk
          - -F=
          - '$1 == "FLANNEL_MTU" { print $2 }'
          - /run/flannel/subnet.env
      register: verify_flannel_mtu
      changed_when: false
      check_mode: false
      when: k3s_role is defined

    - name: Require the measured pod MTU to match the design
      ansible.builtin.assert:
        that:
          - verify_flannel_mtu.stdout | trim == (k3s_expected_pod_mtu | string)
        fail_msg: >-
          Flannel reports pod MTU {{ verify_flannel_mtu.stdout | trim | default('unknown') }};
          expected {{ k3s_expected_pod_mtu }} after the WireGuard/VXLAN path test.
          A missing or different MTU is a verification failure, not a skip.
      when: k3s_role is defined

    - name: Verify selected nodes through the control plane
      run_once: true
      tags: [verify_api]
      block:
        - name: Require an inventory control-plane delegate
          ansible.builtin.assert:
            that:
              - k3s_server_host | default('') in groups['k3s_servers']

        - name: Read API readiness from the server
          ansible.builtin.command:
            argv:
              - "{{ k3s_bin_path }}"
              - kubectl
              - --kubeconfig=/etc/rancher/k3s/k3s.yaml
              - get
              - --raw=/readyz
          delegate_to: "{{ k3s_server_host }}"
          register: verify_api_readiness
          changed_when: false
          check_mode: false

        - name: Require a ready API
          ansible.builtin.assert:
            that:
              - verify_api_readiness.stdout | trim == 'ok'

        - name: Read the cluster nodes
          kubernetes.core.k8s_info:
            kubeconfig: /etc/rancher/k3s/k3s.yaml
            api_version: v1
            kind: Node
          delegate_to: "{{ k3s_server_host }}"
          register: verify_k8s_nodes
          check_mode: false

        - name: Require every selected node to be present and Ready with its expected address
          ansible.builtin.assert:
            that:
              - selected_nodes | length == 1
              - >-
                selected_nodes[0].status.conditions
                | selectattr('type', 'equalto', 'Ready')
                | selectattr('status', 'equalto', 'True') | list | length == 1
              - >-
                selected_nodes[0].status.addresses
                | selectattr('type', 'equalto', 'InternalIP')
                | map(attribute='address') | list == [hostvars[item].wireguard_address]
            fail_msg: >-
              Selected node {{ item }} must be present, Ready, and have exactly
              InternalIP {{ hostvars[item].wireguard_address }}; observed {{ selected_nodes }}.
          vars:
            selected_nodes: >-
              {{ verify_k8s_nodes.resources | selectattr('metadata.name', 'equalto', item) | list }}
          loop: "{{ ansible_play_hosts_all }}"

        - name: Report the verification scope
          ansible.builtin.debug:
            msg: >-
              API ready via {{ k3s_server_host }}. Verified selected nodes only:
              {{ ansible_play_hosts_all | join(', ') }} (Ready and exact WireGuard InternalIP).
