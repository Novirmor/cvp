---
- name: Verify live WireGuard configuration without changing it
  ansible.builtin.command:
    argv:
      - "{{ wireguard_state_helper }}"
      - verify
      - --interface
      - "{{ wireguard_interface }}"
      - --config
      - "/etc/wireguard/{{ wireguard_interface }}.conf"
      - --record
      - "{{ wireguard_state_record }}"
  changed_when: false
  check_mode: false
  no_log: true
  when: wireguard_manage_config | bool
