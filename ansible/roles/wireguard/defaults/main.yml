---
wireguard_interface: wg0
wireguard_activation_stamp: "/etc/wireguard/.cvp-{{ wireguard_interface }}-activation"
wireguard_state_helper: /usr/local/sbin/cvp-wireguard-state
wireguard_state_record: "/etc/wireguard/.cvp-{{ wireguard_interface }}-live.json"
wireguard_port: 51820
wireguard_address: ""
wireguard_private_key_file: /etc/wireguard/privatekey
wireguard_private_key: ""
wireguard_rotate_private_key: false
wireguard_rotation_confirm: ""
wireguard_mtu: 1420
wireguard_persistent_keepalive: 25
wireguard_manage_config: true
wireguard_peers_group: wireguard
