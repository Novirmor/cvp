---
- name: Install the Tailscale repository key
  ansible.builtin.get_url:
    url: "{{ tailscale_repo_url }}/{{ ansible_distribution | lower }}/{{ ansible_distribution_release }}.noarmor.gpg"
    dest: "{{ tailscale_keyring_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Configure the pinned Tailscale package source
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by={{ tailscale_keyring_path }}]
      {{ tailscale_repo_url }}/{{ ansible_distribution | lower }}
      {{ ansible_distribution_release }} main
    filename: tailscale
    state: present

- name: Prefer the configured Tailscale source
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/tailscale
    content: |
      Package: tailscale
      Pin: origin "pkgs.tailscale.com"
      Pin-Priority: 700
    owner: root
    group: root
    mode: "0644"

- name: Install Tailscale
  ansible.builtin.apt:
    name: "{{ 'tailscale=' ~ tailscale_package_version if tailscale_package_version | length > 0 else 'tailscale' }}"
    state: present
    update_cache: true
  when: not ansible_check_mode

- name: Enable the Tailscale service
  ansible.builtin.systemd_service:
    name: tailscaled.service
    state: started
    enabled: true
  when: not ansible_check_mode

- name: Read Tailscale backend state
  ansible.builtin.command: tailscale status --json
  register: tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Report deferred Tailscale provisioning in check mode
  ansible.builtin.debug:
    msg: Check mode reads existing Tailscale state; package installation, service startup, and enrollment are deferred.
  when: ansible_check_mode

- name: Enroll Tailscale when an external auth key is supplied
  ansible.builtin.include_tasks: enroll.yml
  when:
    - not ansible_check_mode
    - tailscale_auth_key | length > 0
    - >-
      tailscale_status.rc != 0 or
      (tailscale_status.stdout | default('{}', true) | from_json).BackendState | default('') != 'Running'

- name: Refresh the Tailscale backend state
  ansible.builtin.command: tailscale status --json
  register: tailscale_refreshed_status
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Select the refreshed Tailscale state
  ansible.builtin.set_fact:
    tailscale_status: "{{ tailscale_refreshed_status }}"
  when: not ansible_check_mode

- name: Keep Tailscale SSH disabled on enrolled hosts
  ansible.builtin.assert:
    that:
      - tailscale_extra_set_args is sequence
      - tailscale_extra_set_args is not string
      - tailscale_extra_set_args | select('match', '^-{1,2}ssh(?:=|$)') | list | length == 0
    fail_msg: SSH uses the node's public address; Tailscale SSH cannot be enabled.

# Tailscale carries people to internal services only; its SSH server stays off
# even if it was enabled out of band.
- name: Reconcile mutable Tailscale settings on an enrolled host
  ansible.builtin.command:
    argv: "{{ ['tailscale', 'set',
               '--hostname=' ~ node_name,
               '--accept-dns=' ~ ('true' if tailscale_accept_dns | bool else 'false'),
               '--advertise-tags=' ~ (tailscale_advertise_tags | join(','))]
             + tailscale_extra_set_args + ['--ssh=false'] }}"
  register: tailscale_reconcile
  changed_when: false
  when:
    - not ansible_check_mode
    - tailscale_status.rc == 0
    - tailscale_status.stdout | trim | length > 0
    - (tailscale_status.stdout | from_json).BackendState | default('') == 'Running'
