---
- name: Require lifecycle ownership before server convergence
  ansible.builtin.include_tasks: lifecycle/assert.yml

- name: Require the server inventory role
  ansible.builtin.assert:
    that:
      - k3s_role == 'server'
      - k3s_version | length > 0
      - wireguard_address | length > 0
      - k3s_server_init is defined
      - k3s_datastore in ['etcd', 'sqlite']
    fail_msg: >-
      The K3s server needs k3s_role=server, a pinned k3s_version, a WireGuard
      node address, an explicit k3s_server_init flag, and a supported
      k3s_datastore (etcd or sqlite).

- name: Validate the private NodePort address
  ansible.builtin.include_tasks: validate-nodeport.yml

- name: Refuse convergence during an unresolved restore
  ansible.builtin.stat:
    path: "{{ k3s_restore_guard_path | default('/var/lib/cvp/k3s-restore-in-progress') }}"
  register: k3s_restore_guard_stat

- name: Require recovery to be resolved before server activation
  ansible.builtin.assert:
    that: not k3s_restore_guard_stat.stat.exists
    fail_msg: Resolve the restore guard and verify the intended datastore before convergence.

- name: Check backup continuity before any K3s changes
  ansible.builtin.include_tasks: backup.yml
  vars:
    _k3s_backup_preflight_only: true

- name: Validate configuration sources before server changes
  ansible.builtin.include_tasks: validate-config.yml

- name: Validate enabled backup configuration before server changes
  ansible.builtin.assert:
    that:
      - k3s_backup_age_recipient | length > 0
      - k3s_backup_upload_command | length > 0
      - k3s_backup_retention_days | int > 0
  when: k3s_backup_enabled | bool

- name: Install K3s host dependencies
  ansible.builtin.apt:
    name:
      - conntrack
      - socat
    state: present
    update_cache: true
    lock_timeout: 60
  async: "{{ 0 if ansible_check_mode else 900 }}"
  poll: 5

- name: Create K3s configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/rancher/k3s
    - "{{ k3s_data_dir }}"
    # The joining-server token install writes server/token before K3s ever
    # creates the directory itself.
    - "{{ k3s_data_dir }}/server"

- name: Download the pinned K3s server artifact with release checksum verification
  ansible.builtin.get_url:
    url: "{{ k3s_binary_url }}"
    checksum: "sha256:{{ k3s_checksum_url }}"
    timeout: 30
    dest: "{{ k3s_bin_path }}"
    owner: root
    group: root
    mode: "0755"

- name: Check for a dedicated agent join token on the init server
  ansible.builtin.stat:
    path: "{{ k3s_agent_token_server_path }}"
  register: k3s_agent_token_stat
  when: k3s_server_init | bool

- name: Generate a dedicated agent join token on the init server
  ansible.builtin.command:
    argv: [timeout, --kill-after=5s, 15s, openssl, rand, -base64, '48']
  register: k3s_agent_token_generated
  changed_when: true
  no_log: true
  when:
    - k3s_server_init | bool
    - not k3s_agent_token_stat.stat.exists
    - not ansible_check_mode

- name: Persist the dedicated agent join token on the init server
  ansible.builtin.copy:
    dest: "{{ k3s_agent_token_server_path }}"
    content: "{{ k3s_agent_token_generated.stdout | trim }}\n"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when:
    - k3s_server_init | bool
    - not k3s_agent_token_stat.stat.exists
    - not ansible_check_mode

- name: Link the K3s client tools
  ansible.builtin.file:
    src: "{{ k3s_bin_path }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    owner: root
    group: root
    force: true
  loop:
    - kubectl
    - crictl
    - ctr

- name: Wait for the init server to publish its tokens
  ansible.builtin.wait_for:
    path: "{{ k3s_server_token_path }}"
    state: present
    timeout: 300
  delegate_to: "{{ k3s_cluster_init_host }}"
  when: not k3s_server_init | bool and not ansible_check_mode

- name: Read the server token from the init server
  ansible.builtin.slurp:
    src: "{{ k3s_server_token_path }}"
  delegate_to: "{{ k3s_cluster_init_host }}"
  register: k3s_join_server_token
  no_log: true
  when: not k3s_server_init | bool and not ansible_check_mode

- name: Read the agent token from the init server
  ansible.builtin.slurp:
    src: "{{ k3s_agent_token_server_path }}"
  delegate_to: "{{ k3s_cluster_init_host }}"
  register: k3s_join_agent_token
  no_log: true
  when: not k3s_server_init | bool and not ansible_check_mode

# No secrets-encryption key copy: K3s distributes the encryption config to
# joining servers as part of the datastore bootstrap data, and in v1.35 the
# file is server/cred/encryption-config.json, managed by K3s itself.

- name: Install the server token on the joining server
  ansible.builtin.copy:
    dest: "{{ k3s_server_token_path }}"
    content: "{{ k3s_join_server_token.content | b64decode }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: not k3s_server_init | bool and not ansible_check_mode

- name: Install the agent token on the joining server
  ansible.builtin.copy:
    dest: "{{ k3s_agent_token_server_path }}"
    content: "{{ k3s_join_agent_token.content | b64decode }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: not k3s_server_init | bool and not ansible_check_mode

- name: Render the K3s server configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ k3s_config_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Install the K3s server systemd unit
  ansible.builtin.template:
    src: k3s.service.j2
    dest: /etc/systemd/system/k3s.service
    owner: root
    group: root
    mode: "0644"

- name: Install the persistent recovery startup inhibit
  ansible.builtin.include_tasks: install-start-guard.yml

- name: Activate and verify the K3s server
  ansible.builtin.include_tasks: activate.yml
  when: not ansible_check_mode
  vars:
    k3s_activation_unit: k3s.service
    k3s_activation_stamp: "{{ k3s_data_dir }}/.cvp-server-activation"
    k3s_activation_inputs: >-
      {{ [k3s_bin_path, k3s_config_path, '/etc/systemd/system/k3s.service', k3s_agent_token_server_path,
          k3s_start_guard_path | default('/usr/local/libexec/cvp-k3s-start-guard'),
          k3s_start_guard_dropin | default('/etc/systemd/system/k3s.service.d/50-cvp-restore-guard.conf')]
          + ([k3s_server_token_path] if not k3s_server_init | bool else []) }}

- name: Wait for the server token to exist
  ansible.builtin.wait_for:
    path: "{{ k3s_server_token_path }}"
    state: present
    timeout: 180
  when: not ansible_check_mode

- name: Report the limits of a server check-mode preview
  ansible.builtin.debug:
    msg: Check mode previews configuration only; token exchange and activation require a real convergence run.
  when: ansible_check_mode

- name: Configure the host backup unit
  ansible.builtin.include_tasks: backup.yml

...
