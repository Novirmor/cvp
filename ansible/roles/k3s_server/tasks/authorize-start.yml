---
- name: Authorize exactly one recovery verification startup
  ansible.builtin.command:
    argv:
      - python3
      - "{{ k3s_start_guard_path | default('/usr/local/libexec/cvp-k3s-start-guard') }}"
    stdin: >-
      {{ {'action': 'authorize', 'guard': restore_guard,
          'legacy_guard': k3s_data_dir ~ '/.cvp-restore-in-progress',
          'authorization': k3s_start_authorization_path | default('/run/cvp/k3s-restore-start'),
          'lock': cvp_lifecycle_lock_path | default('/var/lib/cvp/lifecycle.lock'),
          'token': cvp_lifecycle_token} | to_json }}
  changed_when: true
  no_log: true
