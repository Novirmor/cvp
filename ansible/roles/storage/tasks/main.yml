---
- name: Inspect storage before any mutation
  ansible.builtin.include_tasks: inspect.yml
  vars:
    _storage_inspection_action: preflight
  when: storage_enabled | bool

- name: Converge directory-backed storage permissions
  ansible.builtin.file:
    path: "{{ storage_mountpoint }}"
    state: directory
    owner: root
    group: root
    mode: "{{ storage_directory_mode }}"
  when:
    - storage_enabled | bool
    - storage_device | length == 0

- name: Converge storage after the safety gate
  when:
    - storage_enabled | bool
    - not ansible_check_mode
  block:
    - name: Format the explicitly approved blank ext4 device
      ansible.builtin.command:
        argv:
          - /usr/sbin/mkfs.ext4
          - "{{ _storage_inspection.device }}"
      changed_when: true
      when: _storage_inspection.needs_format

    - name: Refresh device and mount safety after filesystem preparation
      ansible.builtin.include_tasks: inspect.yml
      vars:
        _storage_inspection_action: preflight

    - name: Require a prepared filesystem before mounting
      ansible.builtin.assert:
        that:
          - not _storage_inspection.needs_format

    - name: Create a missing local-path storage directory
      ansible.builtin.file:
        path: "{{ storage_mountpoint }}"
        state: directory
        owner: root
        group: root
        mode: "{{ storage_directory_mode }}"
      when: storage_device | length > 0 and not _storage_inspection.mountpoint_exists

    - name: Persist and mount the verified storage filesystem
      ansible.posix.mount:
        path: "{{ storage_mountpoint }}"
        src: "UUID={{ _storage_inspection.uuid }}"
        fstype: "{{ _storage_inspection.filesystem }}"
        opts: "{{ storage_mount_options }}"
        state: mounted
      when: storage_device | length > 0

    - name: Verify storage identity after convergence
      ansible.builtin.include_tasks: verify.yml

    - name: Set permissions on the verified volume root
      ansible.builtin.file:
        path: "{{ storage_mountpoint }}"
        state: directory
        owner: root
        group: root
        mode: "{{ storage_directory_mode }}"
      when: storage_device | length > 0
