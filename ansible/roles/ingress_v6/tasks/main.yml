---
- name: Require bounded ingress connections
  ansible.builtin.assert:
    that:
      - ingress_v6_max_children | int > 0
      - ingress_v6_connect_timeout | int > 0

- name: Require socat and listener inspection tools
  ansible.builtin.package:
    name: [socat, iproute2]
    state: present

- name: Install the IPv6 ingress forwarder units
  ansible.builtin.template:
    src: cvp-ingress-v6.service.j2
    dest: /etc/systemd/system/cvp-ingress-v6-{{ item }}.service
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ingress_v6_ports }}"
  vars:
    ingress_v6_port: "{{ item }}"

- name: Activate and verify the IPv6 ingress forwarders
  ansible.builtin.include_tasks: "{{ role_path }}/../base/tasks/activate-service.yml"
  vars:
    _cvp_service_unit: "cvp-ingress-v6-{{ item }}.service"
    _cvp_service_enabled: true
    _cvp_service_inputs:
      - "/etc/systemd/system/cvp-ingress-v6-{{ item }}.service"
    _cvp_service_stamp: "/etc/systemd/system/.cvp-ingress-v6-{{ item }}-activation"
    _cvp_service_probe_port: "{{ item }}"
  loop: "{{ ingress_v6_ports }}"
  when: not ansible_check_mode
