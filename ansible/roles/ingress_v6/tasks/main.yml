---
- name: Require socat
  ansible.builtin.package:
    name: socat
    state: present

- name: Install the IPv6 ingress forwarder units
  ansible.builtin.template:
    src: cvp-ingress-v6.service.j2
    dest: /etc/systemd/system/cvp-ingress-v6-{{ item }}.service
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ingress_v6_ports }}"
  vars:
    ingress_v6_port: "{{ item }}"
  notify: Restart the IPv6 ingress forwarders

- name: Enable the IPv6 ingress forwarders
  ansible.builtin.systemd_service:
    name: cvp-ingress-v6-{{ item }}.service
    state: started
    enabled: true
    daemon_reload: true
  loop: "{{ ingress_v6_ports }}"
