---
- name: Install the live firewall evidence helper
  ansible.builtin.copy:
    src: cvp-firewall-state
    dest: "{{ firewall_state_helper }}"
    owner: root
    group: root
    mode: "0755"

- name: Apply and record the live firewall policy
  block:
    - name: Invalidate previous firewall evidence
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ firewall_activation_stamp }}"
        - "{{ firewall_state_record }}"

    - name: Validate the pending firewall policy
      ansible.builtin.command: nft -c -f /etc/nftables.conf
      changed_when: false

    - name: Enable the firewall service
      ansible.builtin.systemd_service:
        name: nftables.service
        state: started
        enabled: true
        daemon_reload: true

    - name: Atomically reapply the owned firewall table
      ansible.builtin.command: nft -f /etc/nftables.conf
      changed_when: true

    - name: Record the successfully applied live policy
      ansible.builtin.command:
        argv: ["{{ firewall_state_helper }}", record, --record, "{{ firewall_state_record }}"]
      changed_when: true

    - name: Verify live firewall enforcement
      ansible.builtin.include_tasks: verify.yml
  rescue:
    - name: Remove failed firewall evidence
      ansible.builtin.file:
        path: "{{ firewall_state_record }}"
        state: absent

    - name: Report the failed firewall activation
      ansible.builtin.fail:
        msg: Firewall activation failed. No success evidence is retained; correct the failure and rerun convergence.
