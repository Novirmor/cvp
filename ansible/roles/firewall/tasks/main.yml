---
- name: Install administration preflight inspection tools
  ansible.builtin.apt:
    name: iproute2
    state: present
    update_cache: true
    cache_valid_time: 3600
    policy_rc_d: 101
  when: firewall_manage | bool

- name: Read Tailscale state before firewall activation
  ansible.builtin.command: tailscale status --json
  register: firewall_tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false
  when: firewall_manage | bool

- name: Read the remote SSH session before privilege escalation
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "import os; print(os.environ.get('SSH_CONNECTION', ''))"
  become: false
  vars:
    ansible_become: false
  register: firewall_remote_ssh_connection
  changed_when: false
  check_mode: false
  when:
    - firewall_manage | bool
    - ansible_env.SSH_CONNECTION | default('') | length == 0

- name: Verify the candidate firewall administration path
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', '../files/cvp-admin-access-check') }}"
    stdin: >-
      {{ {'firewall_ssh_port': firewall_ssh_port,
          'base_ssh_port': base_ssh_port | default(22),
          'ipv4_source_cidrs': firewall_ssh_ipv4_source_cidrs,
          'ipv6_source_cidrs': firewall_ssh_ipv6_source_cidrs,
          'ssh_connection': ansible_env.SSH_CONNECTION
                            | default(firewall_remote_ssh_connection.stdout | default(''), true),
          'tailscale_rc': firewall_tailscale_status.rc,
           'tailscale_status': firewall_tailscale_status.stdout,
           'wireguard_interface': wireguard_interface,
           'wireguard_address': wireguard_address | default(''),
          'wireguard_peer_addresses': groups.get(wireguard_peers_group | default('wireguard'), [])
                                     | map('extract', hostvars, 'wireguard_address') | list} | to_json }}
  register: firewall_admin_access
  changed_when: false
  check_mode: false
  when: firewall_manage | bool

- name: Require a verified private or temporary bootstrap administration path
  ansible.builtin.assert:
    that:
      - >-
        (((firewall_admin_access | default({})).get('stdout', '{}') | from_json).path
         | default('')) in ['source-cidr', 'tailscale', 'wireguard']
        or ((((firewall_admin_access | default({})).get('stdout', '{}') | from_json).path
             | default('')) == 'connection-proof-unavailable'
            and (firewall_ssh_ipv4_source_cidrs | length > 0 or firewall_ssh_ipv6_source_cidrs | length > 0))
    fail_msg: >-
      Refusing to activate a default-deny firewall without successful administration-path
      preflight evidence. Tailscale Running and a private destination IP do not prove
      ingress through a private interface. Stock unbound sshd sockets require an explicit
      firewall_ssh_ipv4_source_cidrs or firewall_ssh_ipv6_source_cidrs entry matching
      the actual client source. Check mode does not enroll Tailscale.
  when: firewall_manage | bool

- name: Require CIDR allowlists to be lists
  ansible.builtin.assert:
    that:
      - firewall_ssh_ipv4_source_cidrs is sequence
      - firewall_ssh_ipv4_source_cidrs is not string
      - firewall_ssh_ipv6_source_cidrs is sequence
      - firewall_ssh_ipv6_source_cidrs is not string
    fail_msg: >-
      Firewall CIDR variables must be lists. Pass them as JSON, for example
      -e '{"firewall_ssh_ipv4_source_cidrs":["203.0.113.10/32"]}'.
  when: firewall_manage | bool

- name: Require real external interfaces before enabling the firewall
  ansible.builtin.assert:
    that:
      - firewall_external_interfaces | length > 0
      - firewall_external_interfaces | difference(ansible_interfaces) | length == 0
      - firewall_external_interfaces | intersect(['lo', wireguard_interface, 'tailscale0']) | length == 0
    fail_msg: >-
      Set firewall_external_ipv4_interface and firewall_external_ipv6_interface
      to the real public uplinks. At least one real external interface is required.
  when: firewall_manage | bool

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true
    policy_rc_d: 101
  when: firewall_manage | bool

- name: Create the nftables service override directory
  ansible.builtin.file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: firewall_manage | bool

- name: Restrict nftables shutdown to the owned table
  ansible.builtin.copy:
    dest: /etc/systemd/system/nftables.service.d/90-cvp-ownership.conf
    content: |
      [Service]
      ExecStop=
      ExecStop=-/usr/sbin/nft delete table inet cvp_filter
    owner: root
    group: root
    mode: "0644"
  when: firewall_manage | bool

- name: Render the host firewall policy
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nft -c -f %s
  when: firewall_manage | bool

- name: Activate and verify the host firewall
  ansible.builtin.include_tasks: activate.yml
  when: firewall_manage | bool and not ansible_check_mode
