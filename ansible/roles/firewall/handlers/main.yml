---
- name: Validate and reload nftables
  ansible.builtin.command: nft -c -f /etc/nftables.conf
  changed_when: false
  listen: Validate and reload nftables

- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables.service
    state: reloaded
  listen: Validate and reload nftables
