---
# Instance inventory. `task node-new` (or `task init`) adds hosts here and
# selects the cluster-init and API servers below. Platform defaults load first
# from the platform's ansible/defaults; override them in group_vars/all.yml.
all:
  vars:
    k3s_cluster_init_host: ""
    k3s_server_host: ""
  children:
    wireguard:
      hosts: {}
    k3s_servers:
      hosts: {}
    k3s_agents:
      hosts: {}
    storage_stateful:
      hosts: {}
    ingress:
      hosts: {}
